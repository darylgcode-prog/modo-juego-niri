# Contador de FPS del modo juego (MangoHud), con los colores del lanzador.
# Solo se usa en los juegos abiertos desde el lanzador; no toca tu
# configuración general de MangoHud.
# Ocultar o mostrar mientras juegas: Shift derecho + F12.
toggle_hud=Shift_R+F12

position=top-left
font_size=20
round_corners=8
background_alpha=0.35
background_color=070610
text_color=FFFFFF

fps
fps_color_change
fps_value=30,60
fps_color=FF2A9E,FFD166,19D9FF
frame_timing
frametime_color=19D9FF

gpu_stats
gpu_temp
gpu_color=19D9FF
vram
vram_color=19D9FF

cpu_stats
cpu_temp
cpu_color=FF2A9E
ram
ram_color=FF2A9E

engine_color=19D9FF
