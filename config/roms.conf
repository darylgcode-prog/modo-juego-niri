# ROMs del lanzador del modo juego.
#
# «carpeta»: dónde están. Dentro va una subcarpeta por consola, y el
# lanzador reconoce estos nombres:
#   wiiu                    Wii U         (Cemu)
#   switch, nsw             Switch        (Eden)
#   switch2, nsw2           Switch 2      (Eglantine o Lichii)
#   ps1, psx                PlayStation   (DuckStation)
#   ps2                     PlayStation 2 (PCSX2)
#   ps3                     PlayStation 3 (RPCS3)
#   psp                     PSP           (PPSSPP)
#   gamecube, gc            GameCube      (Dolphin)
#   wii                     Wii           (Dolphin)
#   3ds                     3DS           (Azahar)
# Se puede poner más de una línea «carpeta». El emulador tiene que estar
# instalado y aparecer en el menú de aplicaciones.
carpeta = ~/ROMs

# Con qué emulador abrir una consola, cuando hay más de uno. El valor es
# el nombre del acceso del emulador (sin «.desktop»).
#switch2 = lichii
